# Embedded SQLite deployment: a single instance owning one persistent volume. This is the
# instance-per-tenant / embedded-first model (see TODO #9, docs/use-cases.md). A StatefulSet rather
# than a Deployment because the instance is stateful — it must keep the same PersistentVolume across
# restarts, and there must never be two pods writing the same SQLite file, which the StatefulSet's
# at-most-one-per-ordinal guarantee (with replicas: 1) provides. To run more than one tenant, apply
# this overlay again into a different namespace (or with a different nameSuffix) — never scale
# replicas above 1, which SQLite cannot share.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hippocampus
  labels:
    app.kubernetes.io/name: hippocampus
    app.kubernetes.io/part-of: hippocampus
    app.kubernetes.io/component: service
spec:
  serviceName: hippocampus-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hippocampus
  template:
    metadata:
      annotations:
        # Picked up by the annotation-based scrape config most Prometheus installations ship with.
        # A prometheus-operator cluster uses a ServiceMonitor instead (see deploy/k8s/README.md);
        # the annotations are inert there, so both are declared once and neither has to be chosen.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: hippocampus
        app.kubernetes.io/part-of: hippocampus
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: hippocampus
      automountServiceAccountToken: false
      # The 5s preStop sleep plus the service's shutdown, which bounds each of its phases (gateway
      # drain, gRPC graceful stop, telemetry flush) by shutdown.timeoutSeconds (10s by default).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hippocampus
          image: ghcr.io/fastbean-au/hippocampus:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/hippocampus/config.json"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          startupProbe:
            # Holds the other two probes off until the process is serving, however long the schema
            # migrations or the storage lock take - so liveness needs no initial delay that a slow
            # start could outrun. 60 x 2s gives it two minutes.
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            # Pure process liveness — never restarts on a transient store outage.
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Database-aware: pulls the pod out of the Service's endpoints if the store is
            # unreachable, without restarting it, and from the moment shutdown begins.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Keeps serving while the endpoint removal propagates to every node's proxy and to the
            # load balancers, before SIGTERM arrives. /readyz fails from SIGTERM on and the shutdown
            # drains in-flight RPCs. A native sleep, since the image has no shell (Kubernetes 1.30+).
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/hippocampus
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: hippocampus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # Size for the memory store: the SQLite file plus its WAL. Raise for larger stores;
            # keep it comfortably above consolidation.capacityBytes if that is set.
            storage: 5Gi
