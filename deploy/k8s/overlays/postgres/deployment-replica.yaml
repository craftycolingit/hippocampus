# Read/write replicas. They serve the full RPC surface (reads AND writes) but never consolidate:
# consolidation.enabled: false, so they skip the advisory lock and the Sleep RPC returns
# FailedPrecondition. Scale `replicas` freely for throughput; the base Service load-balances across
# these and the consolidator. See docs/operations.md → Horizontal scaling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hippocampus-replica
  labels:
    app.kubernetes.io/name: hippocampus
    app.kubernetes.io/part-of: hippocampus
    app.kubernetes.io/component: replica
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hippocampus
      app.kubernetes.io/component: replica
  template:
    metadata:
      annotations:
        # Picked up by the annotation-based scrape config most Prometheus installations ship with.
        # A prometheus-operator cluster uses a ServiceMonitor instead (see deploy/k8s/README.md);
        # the annotations are inert there, so both are declared once and neither has to be chosen.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: hippocampus
        app.kubernetes.io/part-of: hippocampus
        app.kubernetes.io/component: replica
    spec:
      serviceAccountName: hippocampus
      automountServiceAccountToken: false
      # The 5s preStop sleep plus the service's shutdown, which bounds each of its phases (gateway
      # drain, gRPC graceful stop, telemetry flush) by shutdown.timeoutSeconds (10s by default).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - until pg_isready -h hippocampus-postgres -U hippocampus -d hippocampus; do echo waiting for postgres; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: hippocampus
          image: ghcr.io/fastbean-au/hippocampus:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/hippocampus/config.json"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            # consolidation.enabled: false → replica: no lock, no sleep cycle, Sleep RPC refused.
            - name: HIPPOCAMPUS_CONSOLIDATION_ENABLED
              value: "false"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hippocampus-secrets
                  key: postgres-password
            - name: HIPPOCAMPUS_STORAGE_POSTGRES_DSN
              value: postgres://hippocampus:$(POSTGRES_PASSWORD)@hippocampus-postgres:5432/hippocampus?sslmode=disable
            - name: HIPPOCAMPUS_AUTH_SIGNINGSECRET
              valueFrom:
                secretKeyRef:
                  name: hippocampus-secrets
                  key: signing-secret
          startupProbe:
            # Holds the other two probes off until the process is serving, however long the schema
            # migrations take - so liveness needs no initial delay that a slow start could outrun.
            # 60 x 2s gives it two minutes.
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            # Pure process liveness - never restarts on a transient store outage.
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Database-aware: pulls the pod out of the Service's endpoints if the store is
            # unreachable, without restarting it, and from the moment shutdown begins.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Keeps serving while the endpoint removal propagates to every node's proxy and to the
            # load balancers, before SIGTERM arrives. /readyz fails from SIGTERM on and the shutdown
            # drains in-flight RPCs. A native sleep, since the image has no shell (Kubernetes 1.30+).
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/hippocampus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hippocampus-config
